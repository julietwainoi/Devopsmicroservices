global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

  - job_name: 'services'
    static_configs:
      - targets:
          - 'auth-service:5000'
          - 'user-service:5000'
          - 'product-service:5000'
          - 'payment-service:5000'
          - 'order-service:5000'
    metrics_path: /metrics
