apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-service-sa
  namespace: default
  labels:
    app: user-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service-sa
  namespace: default
  labels:
    app: order-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
