  namespace: default
  labels:
    app: payment-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-service-sa
  namespace: default
  labels:
    app: product-service
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service-sa
  namespace: default
  labels:
    app: auth-service
