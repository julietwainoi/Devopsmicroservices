# Example: How to use ServiceAccount in your deployments
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      # This is where you assign the ServiceAccount to the pod
      serviceAccountName: user-service-sa
      automountServiceAccountToken: true  # Automatically mount token
      containers:
      - name: user-service
        image: user-service:latest
        ports:
        - containerPort: 5000
        env:
        - name: SERVICE_ACCOUNT
          valueFrom:
            fieldRef:
              fieldPath: spec.serviceAccountName
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      serviceAccountName: order-service-sa
      automountServiceAccountToken: true
      containers:
      - name: order-service
        image: order-service:latest
        ports:
        - containerPort: 5001
        # Service account token is mounted at /var/run/secrets/kubernetes.io/serviceaccount/token
        volumeMounts:
        - name: kube-api-access
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
