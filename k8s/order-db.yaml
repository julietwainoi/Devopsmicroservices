apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: order-db
spec:
  serviceName: order-db          # ← must match the headless service below
  replicas: 1
  selector:
    matchLabels:
      app: order-db
  template:
    metadata:
      labels:
        app: order-db
    spec:
      containers:
        - name: order-db
          image: postgres:16
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: "orders_user"
            - name: POSTGRES_USER
              value: "orders_user"
            - name: POSTGRES_PASSWORD
              value: "orders_pass"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: order-db-storage
              mountPath: /var/lib/postgresql/data
            - name: order-db-init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: order-db-init          # ← ConfigMap stays in volumes (not persistent)
          configMap:
            name: order-db-init
  volumeClaimTemplates:                # ← replaces your separate PVC yaml
    - metadata:
        name: order-db-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: order-db
spec:
  clusterIP: None                      # ← makes it a headless service (required for StatefulSet)
  selector:
    app: order-db
  ports:
    - port: 5432
      targetPort: 5432