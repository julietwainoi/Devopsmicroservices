# RoleBindings connecting ServiceAccounts to Roles
---
# User service can read configs
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: user-service-config-reader
  namespace: default
subjects:
- kind: ServiceAccount
  name: user-service-sa
  namespace: default
roleRef:
  kind: Role
  name: config-reader
  apiGroup: rbac.authorization.k8s.io
---
# Order service needs to manage resources
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: order-service-resource-manager
  namespace: default
subjects:
- kind: ServiceAccount
  name: order-service-sa
  namespace: default
roleRef:
  kind: Role
  name: resource-manager
  apiGroup: rbac.authorization.k8s.io
---
# Payment service can read configs
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: payment-service-config-reader
  namespace: default
subjects:
- kind: ServiceAccount
  name: payment-service-sa
  namespace: default
roleRef:
  kind: Role
  name: config-reader
  apiGroup: rbac.authorization.k8s.io
---
# Auth service can read configs and pods
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auth-service-config-reader
  namespace: default
subjects:
- kind: ServiceAccount
  name: auth-service-sa
  namespace: default
roleRef:
  kind: Role
  name: config-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auth-service-pod-reader
  namespace: default
subjects:
- kind: ServiceAccount
  name: auth-service-sa
  namespace: default
roleRef:
  kind: Role
  name: pod-reader
  apiGroup: rbac.authorization.k8s.io
