name: CI - Build, Push, Update

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'my-app/**'
      - '**.md'
  pull_request:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:

  # ─── Job 1: Detect which services actually changed ───────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      auth:    ${{ steps.filter.outputs.auth }}
      user:    ${{ steps.filter.outputs.user }}
      product: ${{ steps.filter.outputs.product }}
      payment: ${{ steps.filter.outputs.payment }}
      order:   ${{ steps.filter.outputs.order }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'auth-service/**'
            user:
              - 'user-service/**'
            product:
              - 'product-service/**'
            payment:
              - 'payment-service/**'
            order:
              - 'order-service/**'

  # ─── Job 2: Run tests ─────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker Compose version
        run: docker compose version

      - name: Build images for testing
        run: docker compose build
      - name: Debug - check prometheus.yml
        run: |
           ls -la ./monitoring/
           file ./monitoring/prometheus.yml
           cat ./monitoring/prometheus.yml

      - name: Start services
        run: docker compose up -d

      - name: Wait for services
        run: sleep 15

      - name: Check gateway health
        run: curl --fail http://localhost/health/

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Shutdown
        if: always()
        run: docker compose down -v

  # ─── Job 3: Build & push only changed services ───────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [test, changes]
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: echo "TAG=${{ github.sha }}" >> $GITHUB_OUTPUT

      # ── Only builds if auth-service/** changed ──
      - name: Build and push auth-service
        if: needs.changes.outputs.auth == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/auth-service:${{ steps.tag.outputs.TAG }}

      # ── Only builds if user-service/** changed ──
      - name: Build and push user-service
        if: needs.changes.outputs.user == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/user-service:${{ steps.tag.outputs.TAG }}

      # ── Only builds if product-service/** changed ──
      - name: Build and push product-service
        if: needs.changes.outputs.product == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./product-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/product-service:${{ steps.tag.outputs.TAG }}

      # ── Only builds if payment-service/** changed ──
      - name: Build and push payment-service
        if: needs.changes.outputs.payment == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./payment-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/payment-service:${{ steps.tag.outputs.TAG }}

      # ── Only builds if order-service/** changed ──
      - name: Build and push order-service
        if: needs.changes.outputs.order == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/order-service:${{ steps.tag.outputs.TAG }}

      # ── Only update tag in values.yaml for services that changed ──
      - name: Update image tags in values.yaml
        run: |
          TAG=${{ steps.tag.outputs.TAG }}
          PREFIX=${{ env.IMAGE_PREFIX }}

          if [ "${{ needs.changes.outputs.auth }}" == "true" ]; then
            sed -i "s|image: auth-service:.*|image: ${PREFIX}/auth-service:${TAG}|" my-app/values.yaml
          fi
          if [ "${{ needs.changes.outputs.user }}" == "true" ]; then
            sed -i "s|image: user-service:.*|image: ${PREFIX}/user-service:${TAG}|" my-app/values.yaml
          fi
          if [ "${{ needs.changes.outputs.product }}" == "true" ]; then
            sed -i "s|image: product-service:.*|image: ${PREFIX}/product-service:${TAG}|" my-app/values.yaml
          fi
          if [ "${{ needs.changes.outputs.payment }}" == "true" ]; then
            sed -i "s|image: payment-service:.*|image: ${PREFIX}/payment-service:${TAG}|" my-app/values.yaml
          fi
          if [ "${{ needs.changes.outputs.order }}" == "true" ]; then
            sed -i "s|image: order-service:.*|image: ${PREFIX}/order-service:${TAG}|" my-app/values.yaml
          fi

      - name: Commit and push updated values.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add my-app/values.yaml
          git diff --staged --quiet || git commit -m "ci: update image tags to ${{ steps.tag.outputs.TAG }}"
          git push